<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="grid-overlay">
  <div class="grid-container">
    <div class="grid-wrapper grid-wrapper--header">
      <div class="grid-content grid-content--header"></div>
    </div>
    <div class="grid-wrapper grid-wrapper--body">
      <div class="grid-content grid-content--cell grid-content--sidebar">
        <div class="grid-block"></div>
        <div class="grid-block"></div>
        <div class="grid-block"></div>
        <div class="grid-block"></div>
      </div>
      <div class="grid-content grid-content--cell"></div>
      <div class="grid-content grid-content--cell"></div>
      <div class="grid-content grid-content--cell"></div>
      <div class="grid-content grid-content--cell"></div>
      <div class="grid-content grid-content--cell"></div>
      <div class="grid-content grid-content--cell"></div>
      <div class="grid-content grid-content--cell grid-content--sidebar">
        <div class="grid-block grid-block--tall"></div>
      </div>
    </div>
    <div class="grid-wrapper grid-wrapper--footer">
      <div class="grid-content grid-content--footer"></div>
    </div>
  </div>
</div>

<div class="grid-container grid-container--guides">
  <div class="grid-wrapper grid-wrapper--guides">
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
    <div class="grid-content"></div>
  </div>
</div>

<p>Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>

</body>
</html>
